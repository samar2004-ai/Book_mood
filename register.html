<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Mood - Créer un compte</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-background">

    <div class="login-page-wrapper">

        <div class="login-box results-container">

            <h1 class="site-title login-title">Book Mood</h1>
            <hr class="login-hr">

            <h2>Créer un compte</h2>
            <form action="php/register_action.php" method="POST">
                <input type="text" name="name" placeholder="Nom d'utilisateur ou Pseudo" required><br>
                <input type="email" name="email" placeholder="Adresse Email" required><br>
                <input type="password" name="password" placeholder="Mot de passe" required><br>

                <label for="age_range">Votre tranche d'âge :</label>
                <select name="age_range" id="age_range" required>
                    <option value="" class="placeholder" disabled selected>Choix</option>
                    <option value="18-25">18-25 ans</option>
                    <option value="26-40">26-40 ans</option>
                    <option value="41-60">41-60 ans</option>
                    <option value="60+">60 ans et plus</option>
                </select>

                <label for="fav_genre">Genre préféré :</label>
                <select name="fav_genre" id="fav_genre" required>
                    <option value="" class="placeholder" disabled selected>Choix</option>
                    <option value="Fantasy">Fantasy / Science-Fiction</option>
                    <option value="Thriller">Policier / Thriller</option>
                    <option value="Roman">Roman Contemporain</option>
                    <option value="Classique">Classique / Historique</option>
                    <option value="Developpement">Développement Personnel / Essai</option>
                </select>

                <label for="reading_freq">À quelle fréquence lisez-vous ?</label>
                <select name="reading_freq" id="reading_freq" required>
                    <option value="" class="placeholder" disabled selected>Choix</option>
                    <option value="Jamais">Rarement</option>
                    <option value="Mois">Quelques livres par an</option>
                    <option value="Semaine">Un livre par mois</option>
                    <option value="Quotidien">Plusieurs livres par mois</option>
                </select>

                <label for="user_status">Statut utilisateur :</label>
                <select name="user_status" id="user_status" required>
                    <option value="" class="placeholder" disabled selected>Choix</option>
                    <option value="Etudiant">Étudiant(e)</option>
                    <option value="Professionnel">Professionnel(le)</option>
                    <option value="Retraite">Retraité(e)</option>
                    <option value="Autre">Autre</option>
                </select>

                <button type="submit">Créer le compte</button>
            </form>
            <p class="register-link-container">
                Déjà un compte ? <a href="index.php" class="register-link">Se connecter</a>
            </p>

        </div>
    </div>

</body>

</html>
